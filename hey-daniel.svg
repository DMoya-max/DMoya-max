<svg xmlns="http://www.w3.org/2000/svg" width="800" height="78" viewBox="0 0 800 78" role="img" aria-label="Hey! It's Daniel!">
  <defs>
    <linearGradient id="bottomLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="0.35" stop-color="#EF4444"/>
      <stop offset="0.75" stop-color="#3F3F46"/>
      <stop offset="1" stop-color="#3F3F46" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <text x="10" y="54" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="40" font-weight="700" fill="#DC2626" opacity="0.35" filter="url(#neonGlow)">Hey! It's Daniel!</text>
  <text x="10" y="54" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="40" font-weight="700" fill="#EF4444" opacity="0.82">
    <animate attributeName="opacity" values="0.82;1;0.82" dur="3s" repeatCount="indefinite" />
    Hey! It's Daniel!
  </text>

  <path d="M10 72H790" stroke="url(#bottomLine)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
