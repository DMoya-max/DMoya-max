<svg xmlns="http://www.w3.org/2000/svg" width="340" height="310" viewBox="0 0 340 310" role="img" aria-label="Portafolio Personal">
  <defs>
    <linearGradient id="borderRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="topRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="0.18" stop-color="#DC2626"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="0.82" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCA5A5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FCA5A5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="badgeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#DC2626" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="332" height="302" rx="16" fill="#0D0E12" stroke="url(#borderRed)" stroke-width="1.8" filter="url(#cardShadow)"/>
  <ellipse cx="286" cy="32" rx="78" ry="60" fill="url(#cardGlow)"/>

  <!-- Fondo binario ambiental -->
  <g font-family="'Courier New',Consolas,monospace" font-size="10" letter-spacing="2.4" fill="#EF4444" opacity="0.07">
    <text x="250" y="70"><tspan x="250" dy="0">11001</tspan><tspan x="250" dy="15">00110</tspan><tspan x="250" dy="15">10111</tspan><tspan x="250" dy="15">01100</tspan><tspan x="250" dy="15">11101</tspan><tspan x="250" dy="15">01010</tspan><tspan x="250" dy="15">10011</tspan><tspan x="250" dy="15">00101</tspan></text>
    <text x="292" y="82"><tspan x="292" dy="0">01110</tspan><tspan x="292" dy="15">10001</tspan><tspan x="292" dy="15">01011</tspan><tspan x="292" dy="15">11100</tspan><tspan x="292" dy="15">00111</tspan><tspan x="292" dy="15">10100</tspan><tspan x="292" dy="15">01101</tspan></text>
  </g>

  <!-- Línea superior con destello animado -->
  <path d="M20 7H320" stroke="url(#topRed)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M20 7H320" stroke="url(#shine)" stroke-width="2.4" stroke-linecap="round" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="3.5s" begin="2.2s" repeatCount="indefinite" />
  </path>
  <path d="M26 7H80" stroke="#FCA5A5" stroke-width="2.6" stroke-linecap="round" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; 226 0; 0 0" dur="3.5s" begin="2.2s" repeatCount="indefinite" />
  </path>

  <text x="18" y="31" font-family="'Courier New',Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.1" fill="#EF4444">03 / 3D INTERACTIVE</text>
  <g transform="translate(190,14)">
    <ellipse cx="66" cy="13" rx="78" ry="21" fill="url(#badgeGlow)"/>
    <rect width="132" height="26" rx="13" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
    <circle cx="15" cy="13" r="5.4" fill="#22C55E" opacity="0.28"/>
    <circle cx="15" cy="13" r="3.4" fill="#4ADE80">
      <animate attributeName="r" values="3.4;4.4;3.4" dur="1.8s" begin="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" begin="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17.5" font-family="'Courier New',Consolas,monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#4ADE80">EN PRODUCCIÓN</text>
  </g>
  <path d="M18 50H322" stroke="#27272A"/>

  <text x="18" y="82" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Portafolio Personal</text>
  <text x="18" y="104" font-family="'Courier New',Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="0.2" fill="#F87171">EXPERIENCIA WEB 3D &amp; FULL-STACK</text>

  <text x="18" y="142" font-family="Arial,Helvetica,sans-serif" font-size="14.5" fill="#E4E4E7">Portafolio interactivo con araña binaria</text>
  <text x="18" y="162" font-family="Arial,Helvetica,sans-serif" font-size="14.5" fill="#E4E4E7">en Three.js, lluvia de código y envío</text>
  <text x="18" y="182" font-family="Arial,Helvetica,sans-serif" font-size="14.5" fill="#E4E4E7">real con Nodemailer.</text>

  <text x="18" y="210" font-family="'Courier New',Consolas,monospace" font-size="10.5" letter-spacing="1.3" fill="#71717A">STACK</text>
  <g transform="translate(14,218)">
    <rect width="64" height="26" rx="7" fill="#18181B" stroke="#3F3F46"/>
    <path d="M9 1H55" stroke="#DC2626" stroke-width="1" opacity="0.7"/>
    <text x="32" y="17.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Next.js</text>
  </g>
  <g transform="translate(82,218)">
    <rect width="76" height="26" rx="7" fill="#18181B" stroke="#3F3F46"/>
    <path d="M9 1H67" stroke="#DC2626" stroke-width="1" opacity="0.35"/>
    <text x="38" y="17.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">TypeScript</text>
  </g>
  <g transform="translate(162,218)">
    <rect width="64" height="26" rx="7" fill="#18181B" stroke="#3F3F46"/>
    <path d="M9 1H55" stroke="#DC2626" stroke-width="1" opacity="0.7"/>
    <text x="32" y="17.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Three.js</text>
  </g>
  <g transform="translate(230,218)">
    <rect width="53" height="26" rx="7" fill="#18181B" stroke="#3F3F46"/>
    <path d="M9 1H44" stroke="#DC2626" stroke-width="1" opacity="0.35"/>
    <text x="26.5" y="17.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#FAFAFA">Vercel</text>
  </g>

  <path d="M18 260H322" stroke="#27272A"/>
  <text x="18" y="281" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#FAFAFA">portafolio-dmoya.vercel.app ↗</text>
  <text x="18" y="300" font-family="'Courier New',Consolas,monospace" font-size="12.5" fill="#A1A1AA">DMoya-max/portafolio</text>

  <path d="M18 304H322" stroke="url(#topRed)" stroke-width="1" opacity="0.55"/>
</svg>
