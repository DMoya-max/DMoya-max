<svg xmlns="http://www.w3.org/2000/svg" width="380" height="280" viewBox="0 0 380 280" role="img" aria-label="Portafolio Personal">
  <defs>
    <linearGradient id="borderRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="topRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="0.18" stop-color="#DC2626"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="0.82" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCA5A5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FCA5A5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="badgeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#DC2626" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="378" height="278" rx="16" fill="#0D0E12" stroke="url(#borderRed)" stroke-width="1.8" filter="url(#cardShadow)"/>
  <ellipse cx="318" cy="34" rx="82" ry="62" fill="url(#cardGlow)"/>

  <!-- Fondo binario ambiental -->
  <g font-family="'Courier New',Consolas,monospace" font-size="10" letter-spacing="2.4" fill="#EF4444" opacity="0.07">
    <text x="276" y="62"><tspan x="276" dy="0">11001</tspan><tspan x="276" dy="15">00110</tspan><tspan x="276" dy="15">10111</tspan><tspan x="276" dy="15">01100</tspan><tspan x="276" dy="15">11101</tspan><tspan x="276" dy="15">01010</tspan><tspan x="276" dy="15">10011</tspan><tspan x="276" dy="15">00101</tspan><tspan x="276" dy="15">11010</tspan></text>
    <text x="324" y="70"><tspan x="324" dy="0">01110</tspan><tspan x="324" dy="15">10001</tspan><tspan x="324" dy="15">01011</tspan><tspan x="324" dy="15">11100</tspan><tspan x="324" dy="15">00111</tspan><tspan x="324" dy="15">10100</tspan><tspan x="324" dy="15">01101</tspan><tspan x="324" dy="15">11011</tspan></text>
  </g>

  <!-- Línea superior con destello animado -->
  <path d="M24 3H356" stroke="url(#topRed)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M24 3H356" stroke="url(#shine)" stroke-width="2.4" stroke-linecap="round" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="3.5s" begin="2.2s" repeatCount="indefinite" />
  </path>
  <path d="M30 3H86" stroke="#FCA5A5" stroke-width="2.6" stroke-linecap="round" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; 244 0; 0 0" dur="3.5s" begin="2.2s" repeatCount="indefinite" />
  </path>

  <text x="22" y="24" font-family="'Courier New',Consolas,monospace" font-size="10" letter-spacing="1.3" fill="#EF4444" opacity="0.9">03 / 3D INTERACTIVE</text>
  <g transform="translate(250,12)">
    <ellipse cx="54" cy="10.5" rx="62" ry="19" fill="url(#badgeGlow)"/>
    <rect width="108" height="21" rx="10.5" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
    <circle cx="13" cy="10.5" r="4.6" fill="#22C55E" opacity="0.28"/>
    <circle cx="13" cy="10.5" r="2.8" fill="#4ADE80">
      <animate attributeName="r" values="2.8;3.6;2.8" dur="1.8s" begin="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" begin="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="14" font-family="'Courier New',Consolas,monospace" font-size="8.5" letter-spacing="0.5" fill="#4ADE80">EN PRODUCCIÓN</text>
  </g>
  <path d="M22 40H358" stroke="#27272A"/>

  <text x="22" y="68" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#FAFAFA">Portafolio Personal</text>
  <text x="22" y="87" font-family="'Courier New',Consolas,monospace" font-size="9" letter-spacing="0.2" fill="#DC2626" opacity="0.72">EXPERIENCIA WEB 3D &amp; FULL-STACK</text>

  <text x="22" y="109" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#A1A1AA">Portafolio interactivo con araña binaria</text>
  <text x="22" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#A1A1AA">en Three.js, lluvia de código y envío</text>
  <text x="22" y="141" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#A1A1AA">real con Nodemailer.</text>

  <text x="22" y="165" font-family="'Courier New',Consolas,monospace" font-size="8.5" letter-spacing="1.3" fill="#71717A">STACK</text>
  <g transform="translate(22,172)">
    <rect width="60" height="22" rx="6" fill="#16181D" stroke="#3F3F46"/>
    <path d="M8 1H52" stroke="#DC2626" stroke-width="1" opacity="0.7"/>
    <text x="30" y="15" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#E4E4E7">Next.js</text>
  </g>
  <g transform="translate(88,172)">
    <rect width="76" height="22" rx="6" fill="#16181D" stroke="#3F3F46"/>
    <path d="M8 1H68" stroke="#DC2626" stroke-width="1" opacity="0.35"/>
    <text x="38" y="15" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#E4E4E7">TypeScript</text>
  </g>
  <g transform="translate(170,172)">
    <rect width="62" height="22" rx="6" fill="#16181D" stroke="#3F3F46"/>
    <path d="M8 1H54" stroke="#DC2626" stroke-width="1" opacity="0.7"/>
    <text x="31" y="15" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#E4E4E7">Three.js</text>
  </g>
  <g transform="translate(238,172)">
    <rect width="54" height="22" rx="6" fill="#16181D" stroke="#3F3F46"/>
    <path d="M8 1H46" stroke="#DC2626" stroke-width="1" opacity="0.35"/>
    <text x="27" y="15" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#E4E4E7">Vercel</text>
  </g>

  <path d="M22 208H358" stroke="#27272A"/>
  <text x="22" y="231" font-family="'Courier New',Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#71717A">DEMO</text>
  <text x="68" y="231" font-family="'Courier New',Consolas,monospace" font-size="10" fill="#E4E4E7">portafolio-dmoya.vercel.app ↗</text>
  <text x="22" y="255" font-family="'Courier New',Consolas,monospace" font-size="9" letter-spacing="0.8" fill="#71717A">REPO</text>
  <text x="68" y="255" font-family="'Courier New',Consolas,monospace" font-size="10" fill="#A1A1AA">DMoya-max/portafolio</text>

  <path d="M22 270H358" stroke="url(#topRed)" stroke-width="1" opacity="0.55"/>
</svg>
